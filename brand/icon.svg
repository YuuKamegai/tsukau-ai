<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25806a"/>
      <stop offset="1" stop-color="#17564a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Pointer mark: the brand is about actually operating the tools, so the -->
  <!-- mark is a cursor rather than the usual abstract "AI" orb. Path-only so -->
  <!-- rendering never depends on a font being installed. -->
  <g transform="translate(139 74) scale(8.6)">
    <path d="M0,0 L0,24 L5.5,18.4 L9.1,27 L13.2,25.2 L9.6,16.8 L17,16.8 Z"
          fill="#ffffff"/>
  </g>
  <!-- Sparks: the "AI" half of the idea, kept subordinate to the cursor. -->
  <g fill="#8fe0c6">
    <path d="M300,96 l7.5,18.5 L326,122 l-18.5,7.5 L300,148 l-7.5,-18.5 L274,122 l18.5,-7.5 Z"/>
    <path d="M338,168 l4.6,11.4 L354,184 l-11.4,4.6 L338,200 l-4.6,-11.4 L322,184 l11.4,-4.6 Z"/>
  </g>
</svg>
